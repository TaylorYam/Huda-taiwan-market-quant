name: Demo readiness smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install app dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute initial page without credentials
        run: python scripts/check_demo.py
      - name: Start server and verify liveness
        shell: bash
        run: |
          python -m streamlit run streamlit_app.py --server.address=127.0.0.1 --server.port=8501 >/tmp/huda-streamlit.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in {1..15}; do
            kill -0 "$app_pid" || exit 1
            if python scripts/check_demo.py --url http://127.0.0.1:8501; then
              exit 0
            fi
            sleep 2
          done
          exit 1
