name: TAIEX daily ingestion

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Optional TAIEX calendar year to backfill"
        required: false
        type: string
      month:
        description: "Optional TAIEX calendar month to backfill (1-12)"
        required: false
        type: string
  schedule:
    - cron: "0 8 * * 1-5"

permissions:
  contents: read

concurrency:
  group: taiex-daily-ingestion
  cancel-in-progress: false

jobs:
  collect:
    name: Collect TAIEX daily observations
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      TAIEX_YEAR: ${{ inputs.year || '' }}
      TAIEX_MONTH: ${{ inputs.month || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HTTP client
        run: python -m pip install --upgrade requests

      - name: Verify Supabase secret names are available
        shell: bash
        run: |
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SECRET_KEY:-}" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_SECRET_KEY is empty or unavailable."
            exit 1
          fi

      - name: Collect TAIEX month
        shell: bash
        run: |
          args=()
          if [ -n "${TAIEX_YEAR:-}" ]; then args+=(--year "$TAIEX_YEAR"); fi
          if [ -n "${TAIEX_MONTH:-}" ]; then args+=(--month "$TAIEX_MONTH"); fi
          python -m scripts.collect_taiex_month "${args[@]}"
