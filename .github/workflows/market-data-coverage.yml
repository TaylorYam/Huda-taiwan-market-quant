name: Market data coverage report

on:
  workflow_dispatch:
    inputs:
      start:
        description: "First date, YYYY-MM-DD"
        required: true
        type: string
      end:
        description: "Last date, YYYY-MM-DD"
        required: true
        type: string

permissions:
  contents: read

jobs:
  coverage:
    name: Report persisted factor coverage
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HTTP client
        run: python -m pip install --upgrade requests

      - name: Verify Supabase secrets are available
        shell: bash
        run: |
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SECRET_KEY:-}" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_SECRET_KEY is empty or unavailable."
            exit 1
          fi

      - name: Report coverage
        run: |
          python -m scripts.report_supabase_coverage \
            --start "${{ inputs.start }}" \
            --end "${{ inputs.end }}"
