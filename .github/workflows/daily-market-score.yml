name: Manual daily Market Score

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: Taiwan market date (YYYY-MM-DD)
        required: true
        type: string
      as_of:
        description: Information cutoff with timezone (2026-09-17T20:00:00+08:00)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: daily-market-score-writer
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Calculate and persist
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TARGET_DATE: ${{ inputs.target_date }}
          AS_OF: ${{ inputs.as_of }}
        run: python -m src.scoring.daily_runner --target-date "$TARGET_DATE" --as-of "$AS_OF"
