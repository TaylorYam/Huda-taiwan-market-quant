name: TAIFEX PCR window audit

on:
  workflow_dispatch:
    inputs:
      start:
        description: "First date, YYYY-MM-DD"
        required: false
        default: "2001-12-24"
        type: string
      end:
        description: "Last date, YYYY-MM-DD; blank uses Taiwan today"
        required: false
        type: string

permissions:
  contents: read

jobs:
  audit:
    name: Audit PCR daily windows
    runs-on: ubuntu-latest
    env:
      PCR_START: ${{ inputs.start || '2001-12-24' }}
      PCR_END: ${{ inputs.end || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HTTP client
        run: python -m pip install --upgrade requests

      - name: Audit official PCR windows
        shell: bash
        run: |
          args=(--start "$PCR_START" --output pcr-window-audit.json)
          if [ -n "${PCR_END:-}" ]; then args+=(--end "$PCR_END"); fi
          python -m scripts.audit_taifex_pcr "${args[@]}"

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: taifex-pcr-window-audit
          path: pcr-window-audit.json
          if-no-files-found: error
