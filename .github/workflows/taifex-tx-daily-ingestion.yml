name: TAIFEX TX daily ingestion

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Optional Taiwan trading date (YYYY-MM-DD)"
        required: false
        type: string
  schedule:
    - cron: "0 8 * * 1-5"

permissions:
  contents: read

concurrency:
  group: taifex-tx-daily-ingestion
  cancel-in-progress: false

jobs:
  collect:
    name: Collect TAIFEX TX daily observations
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      REQUESTED_DATE: ${{ inputs.date || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HTTP client
        run: python -m pip install --upgrade requests

      - name: Verify Supabase secret names are available
        shell: bash
        run: |
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SECRET_KEY:-}" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_SECRET_KEY is empty or unavailable."
            exit 1
          fi

      - name: Resolve Taiwan target date
        shell: bash
        run: |
          if [ -z "${REQUESTED_DATE:-}" ]; then
            export REQUESTED_DATE="$(TZ=Asia/Taipei date +%F)"
          fi
          python - <<'PY'
          import os
          from datetime import date

          value = os.environ["REQUESTED_DATE"]
          try:
              parsed = date.fromisoformat(value)
          except ValueError as exc:
              raise SystemExit("date must use YYYY-MM-DD") from exc
          if parsed.isoformat() != value:
              raise SystemExit("date must use canonical YYYY-MM-DD")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"TARGET_DATE={value}\n")
          print(f"Resolved Taiwan target date: {value}")
          PY

      - name: Collect TX exact date
        shell: bash
        run: |
          python -m scripts.collect_taifex_tx_day --date "$TARGET_DATE"
