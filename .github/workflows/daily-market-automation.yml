name: Daily market automation (supervised)

# Manual runs keep explicit inputs; the weekday schedule derives the Taiwan
# date and cutoff on the runner. Source/date guards still stop an unsafe run.
on:
  workflow_dispatch:
    inputs:
      target_date:
        description: Taiwan market date (YYYY-MM-DD)
        required: true
        type: string
      as_of:
        description: Information cutoff with timezone (for example, 2026-09-17T20:00:00+08:00)
        required: true
        type: string
      confirm_write:
        description: Confirm that this run may write observations and Market Score
        required: true
        default: false
        type: boolean
  schedule:
    # First pass after the main sources normally publish.
    - cron: "30 8 * * 1-5"
    # Confirmation pass for delayed or revised official data.
    - cron: "0 14 * * 1-5"
    # 00:30 Asia/Taipei Tuesday-Saturday; separate weekdays preserve the
    # intended occurrence date when GitHub starts a run after the next cron.
    - cron: "30 16 * * 1"
    - cron: "30 16 * * 2"
    - cron: "30 16 * * 3"
    - cron: "30 16 * * 4"
    - cron: "30 16 * * 5"
    # 10:30 Asia/Taipei Tuesday-Saturday; retry sources still unpublished at 00:30.
    - cron: "30 2 * * 2"
    - cron: "30 2 * * 3"
    - cron: "30 2 * * 4"
    - cron: "30 2 * * 5"
    - cron: "30 2 * * 6"

permissions:
  contents: read

concurrency:
  group: daily-market-automation
  cancel-in-progress: false

jobs:
  collect-and-score:
    name: Collect sources, then calculate Market Score
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      REQUESTED_TARGET_DATE: ${{ inputs.target_date }}
      REQUESTED_AS_OF: ${{ inputs.as_of }}
      CONFIRM_WRITE: ${{ inputs.confirm_write }}
      SCHEDULE_CRON: ${{ github.event.schedule }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Validate supervised inputs and secrets
        shell: bash
        run: |
          echo "Validate supervised inputs and secrets" > "$RUNNER_TEMP/daily-market-automation-stage.txt"
          if [[ "${GITHUB_EVENT_NAME:-}" == "schedule" ]]; then
            if ! REQUESTED_TARGET_DATE="$(python -m src.automation.scheduled_target \
              --schedule "$SCHEDULE_CRON" \
              --now "$(TZ=Asia/Taipei date --iso-8601=seconds)")"; then
              {
                echo "## Scheduled target resolution"
                echo ""
                echo "- result: safely stopped before collection or scoring"
                echo "- reason: the official TWSE calendar could not validate the target date"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            export REQUESTED_TARGET_DATE
            export REQUESTED_AS_OF="$(TZ=Asia/Taipei date --iso-8601=seconds)"
            export CONFIRM_WRITE=true
            echo "Scheduled run: schedule=$SCHEDULE_CRON target_date=$REQUESTED_TARGET_DATE as_of=$REQUESTED_AS_OF"
          fi
          if [[ "${CONFIRM_WRITE:-false}" != "true" ]]; then
            echo "::error::Set confirm_write=true to authorize this supervised write run."
            exit 1
          fi
          if [[ -z "${SUPABASE_URL:-}" || -z "${SUPABASE_SECRET_KEY:-}" ]]; then
            echo "::error::SUPABASE_URL or SUPABASE_SECRET_KEY is empty or unavailable."
            exit 1
          fi

          python - <<'PY'
          import os
          from datetime import date, datetime
          from zoneinfo import ZoneInfo

          target_text = os.environ["REQUESTED_TARGET_DATE"]
          as_of_text = os.environ["REQUESTED_AS_OF"]
          try:
              target = date.fromisoformat(target_text)
          except ValueError as exc:
              raise SystemExit("target_date must use YYYY-MM-DD") from exc
          if target.isoformat() != target_text:
              raise SystemExit("target_date must use canonical YYYY-MM-DD")

          try:
              boundary = datetime.fromisoformat(as_of_text.replace("Z", "+00:00"))
          except ValueError as exc:
              raise SystemExit("as_of must be an ISO timestamp with timezone") from exc
          if boundary.tzinfo is None or boundary.utcoffset() is None:
              raise SystemExit("as_of must include a timezone")

          taipei = ZoneInfo("Asia/Taipei")
          canonical_as_of = boundary.astimezone(taipei).isoformat()
          if target > boundary.astimezone(taipei).date():
              raise SystemExit("target_date is after as_of in Asia/Taipei")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"TARGET_DATE={target.isoformat()}\n")
              env_file.write(f"AS_OF_TAIPEI={canonical_as_of}\n")
              env_file.write(f"TARGET_YEAR={target.year}\n")
              env_file.write(f"TARGET_MONTH={target.month:02d}\n")
          print(f"Validated target_date={target.isoformat()} as_of={canonical_as_of}")
          PY

          if [[ "${GITHUB_EVENT_NAME:-}" == "schedule" ]]; then
            {
              echo "## Scheduled input"
              echo ""
              echo "- cron (UTC): \`$SCHEDULE_CRON\`"
              echo "- target_date (Asia/Taipei): \`$REQUESTED_TARGET_DATE\`"
              if [[ "$SCHEDULE_CRON" == "30 16 * * "* ]]; then
                echo "- pass: 00:30 Taipei confirmation of the preceding TWSE trading date"
                echo "- calendar: verified against the official TWSE holiday schedule"
              elif [[ "$SCHEDULE_CRON" == "30 2 * * "* ]]; then
                echo "- pass: 10:30 Taipei delayed-publication confirmation of the preceding TWSE trading date"
                echo "- calendar: verified against the official TWSE holiday schedule"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Source steps are deliberately separate and sequential. A failed
      # collector stops the job, so the score step cannot run on partial input.
      - name: Collect TAIEX month
        shell: bash
        run: |
          echo "TAIEX month (target_date=$TARGET_DATE)" > "$RUNNER_TEMP/daily-market-automation-stage.txt"
          python -m scripts.collect_taiex_month --year "$TARGET_YEAR" --month "$TARGET_MONTH"
          {
            echo "### Source: TAIEX month"
            echo "- target_date: \`$TARGET_DATE\`"
            echo "- collection window: \`${TARGET_YEAR}-${TARGET_MONTH}\`"
            echo "- result: completed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect TWSE foreign cash day
        shell: bash
        run: |
          echo "TWSE foreign cash day (target_date=$TARGET_DATE)" > "$RUNNER_TEMP/daily-market-automation-stage.txt"
          python -m scripts.collect_twse_foreign_cash --date "$TARGET_DATE"
          {
            echo "### Source: TWSE foreign cash day"
            echo "- target_date: \`$TARGET_DATE\`"
            echo "- dataset: BFI82U foreign cash"
            echo "- result: completed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect TWSE market turnover month
        shell: bash
        run: |
          echo "TWSE market turnover month (target_date=$TARGET_DATE)" > "$RUNNER_TEMP/daily-market-automation-stage.txt"
          python -m scripts.collect_twse_market_turnover --year "$TARGET_YEAR" --month "$TARGET_MONTH"
          {
            echo "### Source: TWSE market turnover month"
            echo "- target_date: \`$TARGET_DATE\`"
            echo "- collection window: \`${TARGET_YEAR}-${TARGET_MONTH}\`"
            echo "- dataset: FMTQIK market turnover"
            echo "- result: completed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect TAIFEX TX day
        shell: bash
        run: |
          echo "TAIFEX TX day (target_date=$TARGET_DATE)" > "$RUNNER_TEMP/daily-market-automation-stage.txt"
          python -m scripts.collect_taifex_tx_day --date "$TARGET_DATE"
          {
            echo "### Source: TAIFEX TX day"
            echo "- target_date: \`$TARGET_DATE\`"
            echo "- collection window: exact requested trading date"
            echo "- result: completed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect TAIFEX PCR day
        shell: bash
        run: |
          echo "TAIFEX PCR day (target_date=$TARGET_DATE)" > "$RUNNER_TEMP/daily-market-automation-stage.txt"
          python -m scripts.collect_taifex_pcr --date "$TARGET_DATE"
          {
            echo "### Source: TAIFEX PCR day"
            echo "- target_date: \`$TARGET_DATE\`"
            echo "- result: completed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect TAIFEX VIX month
        shell: bash
        run: |
          echo "TAIFEX VIX month (target_date=$TARGET_DATE)" > "$RUNNER_TEMP/daily-market-automation-stage.txt"
          python -m scripts.collect_taifex_vix_month --year "$TARGET_YEAR" --month "$TARGET_MONTH"
          {
            echo "### Source: TAIFEX VIX month"
            echo "- target_date: \`$TARGET_DATE\`"
            echo "- collection window: \`${TARGET_YEAR}-${TARGET_MONTH}\`"
            echo "- result: completed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect TAIFEX institutional futures snapshot
        shell: bash
        run: |
          echo "TAIFEX institutional futures latest snapshot (target_date=$TARGET_DATE)" > "$RUNNER_TEMP/daily-market-automation-stage.txt"
          collector_log="$RUNNER_TEMP/taifex-institutional-collector.log"
          if ! python -m scripts.collect_taifex_institutional --write --expected-date "$TARGET_DATE" 2>&1 | tee "$collector_log"; then
            mismatch="$(grep -F "official institutional futures observation_date mismatch:" "$collector_log" | tail -n 1 || true)"
            {
              echo "### Source: TAIFEX institutional futures latest snapshot"
              echo "- target_date requested: \`$TARGET_DATE\`"
              echo "- result: collector failed before scoring; no Market Score was calculated by this run"
              if [[ -n "$mismatch" ]]; then
                echo "- date validation: \`$mismatch\`"
                echo "- write safety: the mismatched snapshot was rejected before persistence"
              else
                echo "- date validation: collector did not return a valid snapshot for the requested date; inspect the failed step output for the source error"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          {
            echo "### Source: TAIFEX institutional futures latest snapshot"
            echo "- target_date requested: \`$TARGET_DATE\`"
            echo "- source window: latest official snapshot"
            echo "- expected-date guard: \`$TARGET_DATE\`"
            echo "- result: completed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Refresh scheduled score cutoff after collection
        if: ${{ github.event_name == 'schedule' }}
        shell: bash
        run: |
          # Source rows are ingested during this job. The score boundary must
          # include those rows while manual runs retain their explicit as-of.
          AS_OF_TAIPEI="$(TZ=Asia/Taipei date --iso-8601=seconds)"
          echo "AS_OF_TAIPEI=$AS_OF_TAIPEI" >> "$GITHUB_ENV"
          echo "Scheduled score cutoff refreshed after source collection: $AS_OF_TAIPEI"

      - name: Calculate and persist Market Score
        shell: bash
        run: |
          echo "Market Score (target_date=$TARGET_DATE, as_of=$AS_OF_TAIPEI)" > "$RUNNER_TEMP/daily-market-automation-stage.txt"
          python -m src.scoring.daily_runner --target-date "$TARGET_DATE" --as-of "$AS_OF_TAIPEI"
          {
            echo "### Market Score"
            echo "- target_date: \`$TARGET_DATE\`"
            echo "- as_of (Asia/Taipei): \`$AS_OF_TAIPEI\`"
            echo "- result: calculated and persisted"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish successful run summary
        if: ${{ success() }}
        shell: bash
        run: |
          {
            echo "## Daily market automation completed"
            echo ""
            echo "- target_date (Asia/Taipei): \`${TARGET_DATE}\`"
            echo "- as_of (Asia/Taipei): \`${AS_OF_TAIPEI}\`"
            echo "- source collection: completed"
            echo "- Market Score: calculated and persisted"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish failure summary
        if: ${{ failure() }}
        shell: bash
        run: |
          failed_stage="workflow setup or input validation"
          if [[ -s "$RUNNER_TEMP/daily-market-automation-stage.txt" ]]; then
            failed_stage="$(cat "$RUNNER_TEMP/daily-market-automation-stage.txt")"
          fi
          {
            echo "## Daily market automation failed"
            echo ""
            echo "- target_date (requested): \`${REQUESTED_TARGET_DATE:-unavailable}\`"
            echo "- as_of (requested): \`${REQUESTED_AS_OF:-unavailable}\`"
            echo "- failed or interrupted stage: \`$failed_stage\`"
            echo "- source collection and scoring run sequentially; later steps were skipped after the first failure"
            if [[ "$failed_stage" == "Market Score ("* ]]; then
              echo "- Market Score: scoring started but failed; inspect that step to confirm persistence status"
            else
              echo "- Market Score: not run because input validation or an earlier required source failed"
            fi
            if [[ "${GITHUB_EVENT_NAME:-}" == "schedule" ]]; then
              echo "- date safety: a non-trading date or unpublished/mismatched source is not reassigned to another date"
            fi
            if [[ "$failed_stage" == *"(target_date="* ]]; then
              echo "- source/date result: the named collector did not complete for this target_date; previous-day data is never substituted"
              echo "- check the failed source step for the cause, such as a non-trading date, delayed publication, or source error"
            fi
            case "$failed_stage" in
              "TAIFEX institutional futures latest snapshot ("*)
                echo "- institutional snapshot gate: only the official snapshot matching target_date can be saved; a stale or not-yet-published snapshot is rejected before write"
                echo "- inspect the failed collector step for the expected and observed dates; a Taiwan holiday also has no valid daily snapshot"
                ;;
            esac
            echo "- inspect the failed step above; rerun manually with the same inputs only after the source or configuration issue is addressed"
          } >> "$GITHUB_STEP_SUMMARY"
