name: Market Score range backfill

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: First target date (YYYY-MM-DD)
        required: true
        type: string
      end_date:
        description: Last target date (YYYY-MM-DD)
        required: true
        type: string
      write:
        description: Persist the replay results to Supabase
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: market-score-range-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Replay Market Score history
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: |
          args=(--start-date "$START_DATE" --end-date "$END_DATE")
          if [[ "${{ inputs.write }}" == "true" ]]; then
            args+=(--write)
          fi
          python -m scripts.backfill_market_scores "${args[@]}"
