name: TAIFEX foreign TX open interest ingestion

on:
  workflow_dispatch:
    inputs:
      write:
        description: "Persist the validated snapshot to Supabase"
        required: true
        default: false
        type: boolean
      expected_date:
        description: "Expected official observation date when write=true (YYYY-MM-DD)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: taifex-institutional-daily-ingestion
  cancel-in-progress: false

jobs:
  collect:
    name: Collect TAIFEX foreign TX open interest
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      WRITE_SNAPSHOT: ${{ inputs.write || false }}
      EXPECTED_DATE: ${{ inputs.expected_date || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HTTP client
        run: python -m pip install --upgrade requests

      - name: Verify Supabase secret names are available for write mode
        if: ${{ inputs.write == true }}
        shell: bash
        run: |
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SECRET_KEY:-}" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_SECRET_KEY is empty or unavailable."
            exit 1
          fi

      - name: Validate expected date guard
        shell: bash
        run: |
          if [ "${WRITE_SNAPSHOT:-false}" = "true" ] && [ -z "${EXPECTED_DATE:-}" ]; then
            echo "::error::expected_date is required when write=true."
            exit 1
          fi
          if [ -n "${EXPECTED_DATE:-}" ]; then
            python - <<'PY'
            import os
            from datetime import date

            value = os.environ["EXPECTED_DATE"]
            try:
                parsed = date.fromisoformat(value)
            except ValueError as exc:
                raise SystemExit("expected_date must use YYYY-MM-DD") from exc
            if parsed.isoformat() != value:
                raise SystemExit("expected_date must use canonical YYYY-MM-DD")
            print(f"Expected official observation date: {value}")
            PY
          fi

      - name: Fetch official snapshot
        shell: bash
        run: |
          args=()
          if [ "${WRITE_SNAPSHOT:-false}" = "true" ]; then args+=(--write); fi
          if [ -n "${EXPECTED_DATE:-}" ]; then args+=(--expected-date "$EXPECTED_DATE"); fi
          python -m scripts.collect_taifex_institutional "${args[@]}"
