name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  whitespace:
    name: Check patch whitespace
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed lines
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "${BASE_SHA}...HEAD"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            git show --format= --check HEAD
          else
            git diff --check "${BEFORE_SHA}...HEAD"
          fi

  python:
    name: Python tests and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install --upgrade pip pytest ruff

      - name: Run Ruff lint
        run: ruff check src tests

      - name: Check Ruff formatting
        run: ruff format --check src tests

      - name: Run tests
        run: python -m pytest -q
